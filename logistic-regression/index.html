<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Logistic Regression</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <link rel="stylesheet" href="../shared/styles.css">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <a class="back-link" href="../">← All demos</a>
  <h1>Logistic Regression</h1>
  <p class="subtitle">Click empty space to add a point. Drag points to move them. Double-click a point to flip its class.</p>

  <div id="controls">
    <label><input type="radio" name="cls" value="0" checked> Add class 0 (blue)</label>
    <label><input type="radio" name="cls" value="1"> Add class 1 (red)</label>
    <button id="reset">Reset</button>
    <label><input type="checkbox" id="toggle-heatmap" checked> Show probability heatmap</label>
  </div>

  <svg id="viz"></svg>
  <div id="stats"></div>

  <script src="../shared/utils.js"></script>
  <script src="script.js"></script>
</body>
</html>
