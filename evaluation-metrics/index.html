<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Evaluation Metrics</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <link rel="stylesheet" href="../shared/styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Evaluation Metrics</h1>
  <p class="subtitle">Drag the threshold slider (or the dot on the ROC curve) to see the confusion matrix and metrics update live.</p>

  <div id="controls">
    <label>threshold = <span id="threshold-value">0.50</span>
      <input type="range" id="threshold-slider" min="0" max="1" step="0.01" value="0.5">
    </label>
    <button id="reset">Reset</button>
  </div>

  <div class="panels">
    <div class="panel">
      <h3>Predicted scores</h3>
      <svg id="scores-viz"></svg>
    </div>
    <div class="panel">
      <h3>Confusion matrix</h3>
      <div id="confusion-matrix"></div>
    </div>
    <div class="panel">
      <h3>ROC curve <span id="auc-label"></span></h3>
      <svg id="roc-viz"></svg>
    </div>
  </div>

  <div id="stats"></div>

  <script src="../shared/utils.js"></script>
  <script src="script.js"></script>
</body>
</html>
